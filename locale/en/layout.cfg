advanced-assembler-layout=Compact keeps this fork's 3x3 layout and starter balance. Legacy restores the original 5x5 footprint and fluid ports, plus the speed-20 machine's 3.75 MW power budget, original crafting recipe and research costs. All five tiers use the selected footprint; the four additional tiers retain their published recipes and power requirements. Changing an existing factory's layout can disconnect pipes and inserters.

