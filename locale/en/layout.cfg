[mod-setting-name]
advanced-assembler-layout=Saved assembler layout (before 1.1.6)

[mod-setting-description]
advanced-assembler-layout=Applies only to machine IDs from before 1.1.6 and their saved blueprints/items. Select Original 5x5 before loading a factory from Advanced Assembly Machines Returns or its Space Age port; select Compact 3x3 for earlier Improved factories. Original preserves the old footprint, four fluid ports, speed-20 power/crafting recipe and shared research balance. Newly crafted Small 3x3 and Large 5x5 machines are always available together and keep their fixed sizes. Changing this setting after building a legacy factory can disconnect pipes and inserters.

[string-mod-setting]
advanced-assembler-layout-compact-3x3=Compact 3x3 (earlier Improved factories)
advanced-assembler-layout-legacy-5x5=Original 5x5 (Returns factories)
